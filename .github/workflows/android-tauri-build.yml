name: Android Tauri Build

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional Handy POS release version to match (for example 1.0.21). Defaults to the latest Windows desktop release.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_DJANGO_URL: ${{ secrets.NEXT_PUBLIC_DJANGO_URL }}

      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve matching desktop release version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_RELEASE_VERSION//[[:space:]]/}"

          if [ -z "$version" ]; then
            # `gh release view` selects GitHub's latest release of any type.
            # Select the newest Windows release explicitly so a future Android
            # release cannot make Android pick the wrong app version.
            tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '[.[] | select(.tag_name | startswith("desktop-v")) | .tag_name][0]' 2>/dev/null || true)"
            if [[ "$tag" == desktop-v* ]]; then
              version="${tag#desktop-v}"
            else
              echo "No Windows desktop release was found. Start with the Windows build, or provide release_version when dispatching this workflow."
              exit 1
            fi
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release_version must be a semantic version such as 1.0.21; received: $version"
            exit 1
          fi

          echo "TAURI_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Android visible app version: $version"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy Android SDK `tools` package has been retired. The action
          # supplies command-line tools itself; only adb is needed at this stage.
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK/NDK packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Configure Android SDK/NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Restore Android keystore (optional)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p src-tauri/gen/android
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > src-tauri/gen/android/handypos-release.jks

      - name: Install dependencies
        run: npm ci

      - name: Initialize Android project
        run: npm run tauri:android:init

      - name: Sync Android launcher icon from the desktop source
        run: bash scripts/sync-android-icons.sh

      - name: Build Android APK/AAB
        run: |
          if [ -f src-tauri/gen/android/handypos-release.jks ]; then
            export ANDROID_KEYSTORE_PATH=src-tauri/gen/android/handypos-release.jks
          fi
          npm run tauri:android:build

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
